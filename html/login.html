<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Drop The Beat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary-bg: #1b1b2f;
      --secondary-bg: #162447;
      --accent-color: #e43f5a;
      --text-color: #f1f1f1;
      --text-secondary: #b8b8b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--primary-bg);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Animated background elements */
    .music-note {
      position: absolute;
      color: rgba(228, 63, 90, 0.1);
      font-size: 2rem;
      animation: float 8s infinite ease-in-out;
      z-index: 0;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(15deg); }
    }

    .container {
      background: rgba(22, 36, 71, 0.8);
      backdrop-filter: blur(10px);
      padding: 3rem 2.5rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      z-index: 1;
      position: relative;
      border: 1px solid rgba(228, 63, 90, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-header h1 {
      font-size: 2.5rem;
      background: linear-gradient(to right, #e43f5a, #ff7b54);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-group i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-color);
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px 12px 45px;
      background: rgba(27, 27, 47, 0.5);
      border: 1px solid rgba(228, 63, 90, 0.3);
      border-radius: 8px;
      color: var(--text-color);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(228, 63, 90, 0.2);
    }

    .input-group input::placeholder {
      color: var(--text-secondary);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
    }

    .remember-me input {
      margin-right: 8px;
      accent-color: var(--accent-color);
    }

    .forgot-password a {
      color: var(--accent-color);
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .forgot-password a:hover {
      opacity: 0.8;
    }

    .login-btn {
      background: linear-gradient(45deg, var(--accent-color), #ff7b54);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(228, 63, 90, 0.3);
      margin-bottom: 1.5rem;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(228, 63, 90, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid rgba(228, 63, 90, 0.2);
    }

    .divider::before {
      margin-right: 1rem;
    }

    .divider::after {
      margin-left: 1rem;
    }

    .social-login {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(27, 27, 47, 0.5);
      border: 1px solid rgba(228, 63, 90, 0.3);
      color: var(--text-color);
      font-size: 1.2rem;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .social-btn:hover {
      background: var(--accent-color);
      transform: translateY(-3px);
    }

    .register-link {
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .register-link a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.3s ease;
    }

    .register-link a:hover {
      opacity: 0.8;
    }

    /* Responsive design */
    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.5rem;
        margin: 0 1rem;
      }
      
      .login-header h1 {
        font-size: 2rem;
      }
    }

    /* Animation for form elements */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header,
    .input-group,
    .options,
    .login-btn,
    .divider,
    .social-login,
    .register-link {
      animation: fadeIn 0.6s ease forwards;
    }

    .input-group { animation-delay: 0.2s; }
    .options { animation-delay: 0.3s; }
    .login-btn { animation-delay: 0.4s; }
    .divider { animation-delay: 0.5s; }
    .social-login { animation-delay: 0.6s; }
    .register-link { animation-delay: 0.7s; }
  </style>
</head>
<body>
  <!-- Floating music notes in background -->
  <i class="music-note fas fa-music" style="top: 15%; left: 10%; animation-delay: 0s;"></i>
  <i class="music-note fas fa-music" style="top: 75%; left: 15%; animation-delay: 1s;"></i>
  <i class="music-note fas fa-music" style="top: 40%; left: 85%; animation-delay: 2s;"></i>
  <i class="music-note fas fa-music" style="top: 85%; left: 80%; animation-delay: 1.5s;"></i>
  <i class="music-note fas fa-music" style="top: 10%; left: 50%; animation-delay: 0.5s;"></i>
  <i class="music-note fas fa-music" style="top: 60%; left: 25%; animation-delay: 2.5s;"></i>
  <i class="music-note fas fa-music" style="top: 30%; left: 70%; animation-delay: 1.8s;"></i>

  <div class="container">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Login to continue your musical journey</p>
    </div>

    <form class="login-form">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" placeholder="Username" required />
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" placeholder="Password" required minlength="8" />
      </div>

      <div class="options">
        <div class="remember-me">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember me</label>
        </div>
        <div class="forgot-password">
          <a href="/html/forgetPassword.html">Forgot password?</a>
        </div>
      </div>

      <button type="button" class="login-btn" onclick="window.location.href='/home.html'">Login</button>


      <div class="divider">or continue with</div>

      <div class="social-login">
        <button type="button" class="social-btn">
          <i class="fab fa-google"></i>
        </button>
        <button type="button" class="social-btn">
          <i class="fab fa-facebook-f"></i>
        </button>
        <button type="button" class="social-btn">
          <i class="fab fa-apple"></i>
        </button>
      </div>

      <div class="register-link">
        Don't have an account? <a href="../html/Register.html">Register here</a>
      </div>
    </form>
  </div>

  <script>
    // Add more floating music notes dynamically
    document.addEventListener('DOMContentLoaded', function() {
      const body = document.querySelector('body');
      
      // Create more music notes
      for (let i = 0; i < 5; i++) {
        const note = document.createElement('i');
        note.className = 'music-note fas fa-music';
        
        // Random positioning and animation
        const top = Math.random() * 100;
        const left = Math.random() * 100;
        const delay = Math.random() * 5;
        const duration = 5 + Math.random() * 5;
        const size = 1 + Math.random() * 2;
        
        note.style.top = `${top}%`;
        note.style.left = `${left}%`;
        note.style.animationDelay = `${delay}s`;
        note.style.animationDuration = `${duration}s`;
        note.style.fontSize = `${size}rem`;
        note.style.opacity = 0.1 + Math.random() * 0.2;
        
        body.appendChild(note);
      }

      // Form submission handling
      const loginForm = document.querySelector('.login-form');
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        // Add your login logic here
        console.log('Login form submitted');
      });
    });
  </script>
</body>
</html>
